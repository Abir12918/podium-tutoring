<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podium Attendance Tracker</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDKs (added via CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js"></script>
    
    <script type="module" src="app.js" defer></script>
</head>
<body>
    <div id="auth-container">
        <button id="login-button">Login with Google</button>
    </div>
    
    <div id="attendance-container" style="display: none;">
        <h2>Student Attendance Tracker</h2>
        <ul id="attendance-list">
            <!-- Student attendance list will be populated here -->
        </ul>
        <button id="logout-button">Logout</button>
    </div>
</body>
</html>
